name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:slow
      - run: npm run check:dist
      - run: test "$(node dist/cli.js --version)" = "$(node -p "require('./package.json').version")"
  dogfood:
    if: github.event_name == 'pull_request'
    # After the tests and the dist check, so the comment never comes from a broken or stale dist/cli.js.
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./
        with:
          fail-on: serious-security
